<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Espacial Internacional - Apple Earth Style 3D</title>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #010409; font-family: 'Inter', sans-serif; color: #f3f4f6; user-select: none; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: rgba(10, 15, 29, 0.55);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border-radius: 1.25rem;
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .glass-button:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3); }
        .glass-button.active { background: rgba(59, 130, 246, 0.3); border-color: rgba(96, 165, 250, 0.6); }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.95); } }
        .live-dot { animation: pulse-glow 2s infinite ease-in-out; }
    </style>
</head>
<body class="w-screen h-screen">

    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <div class="relative z-10 w-full h-full pointer-events-none p-4 md:p-6 flex flex-col justify-between">
        <!-- Cabecera -->
        <header class="flex justify-between items-center w-full">
            <div class="glass-panel pointer-events-auto px-5 py-3 flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 live-dot"></span>
                    <span class="text-xs font-semibold tracking-wider uppercase text-emerald-400 font-mono">En vivo</span>
                </div>
                <div class="h-4 w-px bg-white/20"></div>
                <h1 class="text-sm font-semibold tracking-wide text-white/90">ISS TRACKER 3D</h1>
            </div>
            <div class="glass-panel pointer-events-auto px-5 py-3 flex items-center gap-4">
                <div class="text-right">
                    <div id="utc-clock" class="text-sm font-bold font-mono text-white/90">00:00:00 UTC</div>
                    <div id="date-display" class="text-[10px] text-white/50 font-mono">-- --- ----</div>
                </div>
                <button id="btn-recenter" class="glass-button p-2.5 rounded-xl text-white/80 hover:text-white" title="Centrar ISS">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12h3m14 0h3M12 2v3m0 14v3"/></svg>
                </button>
            </div>
        </header>

        <!-- Paneles Centrales -->
        <div class="flex-1 flex justify-between items-stretch my-4 gap-4 overflow-hidden">
            <!-- Izquierda: Telemetría -->
            <aside class="glass-panel pointer-events-auto w-80 flex flex-col p-5 space-y-4 overflow-y-auto">
                <h2 class="text-xs font-bold uppercase tracking-wider text-white/70 pb-3 border-b border-white/10">Telemetría Orbital</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                        <span class="text-[10px] text-white/50 block font-mono">LATITUD</span>
                        <span id="telemetry-lat" class="text-lg font-bold font-mono text-blue-400">0.0000°</span>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                        <span class="text-[10px] text-white/50 block font-mono">LONGITUD</span>
                        <span id="telemetry-lon" class="text-lg font-bold font-mono text-blue-400">0.0000°</span>
                    </div>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] text-white/50 block font-mono">ALTITUD</span>
                        <span id="telemetry-alt" class="text-base font-bold font-mono text-emerald-400">420.0 km</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-white/50 block font-mono">VELOCIDAD</span>
                        <span id="telemetry-spd" class="text-base font-bold font-mono text-amber-400">27,600 km/h</span>
                    </div>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex items-center justify-between">
                    <span class="text-xs text-white/70">Zona Solar</span>
                    <span id="solar-status" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300">Día</span>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-white/70">Tripulación</h3>
                        <span id="crew-count" class="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">-- astronautas</span>
                    </div>
                    <div id="crew-list" class="space-y-1.5 text-xs text-white/80 font-mono">
                        <div class="p-2 bg-white/5 rounded-lg border border-white/5 text-white/50">Cargando astronautas...</div>
                    </div>
                </div>
            </aside>

            <!-- Derecha: Capas y Seguimiento -->
            <aside class="glass-panel pointer-events-auto w-72 flex flex-col p-5 space-y-4 overflow-y-auto">
                <h2 class="text-xs font-bold uppercase tracking-wider text-white/70 pb-3 border-b border-white/10">Control de Cámara y Capas</h2>
                
                <!-- Botón de seguimiento en vivo -->
                <button id="toggle-follow-iss" class="glass-button w-full p-3 rounded-xl flex items-center justify-between text-xs text-white/90">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-400 live-dot"></span>
                        <span>Seguir ISS (Cámara)</span>
                    </div>
                    <span id="follow-status-label" class="text-[10px] font-mono opacity-60">OFF</span>
                </button>

                <div class="space-y-2 pt-2 border-t border-white/10">
                    <button id="toggle-starlink" class="glass-button active w-full p-3 rounded-xl flex items-center justify-between text-xs text-white/90">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                            <span>Constelación Starlink</span>
                        </div>
                        <span class="text-[10px] font-mono opacity-60">Dorado</span>
                    </button>
                    <button id="toggle-jwst" class="glass-button active w-full p-3 rounded-xl flex items-center justify-between text-xs text-white/90">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-purple-400"></span>
                            <span>James Webb (JWST)</span>
                        </div>
                        <span class="text-[10px] font-mono opacity-60">L2 Vector</span>
                    </button>
                    <button id="toggle-clouds" class="glass-button active w-full p-3 rounded-xl flex items-center justify-between text-xs text-white/90">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-white"></span>
                            <span>Capa de Nubes</span>
                        </div>
                        <span class="text-[10px] font-mono opacity-60">NASA</span>
                    </button>
                </div>
            </aside>
        </div>

        <!-- Pie -->
        <footer class="flex justify-between items-center w-full">
            <div class="glass-panel pointer-events-auto px-4 py-2 text-[11px] text-white/60 font-mono">
                API Latencia: <span id="api-latency" class="text-emerald-400">--</span> | Actualización: <span id="api-countdown">5s</span>
            </div>
        </footer>
    </div>

    <script>
        const EARTH_RADIUS = 5;
        let scene, camera, renderer, controls;
        let earthMesh, cloudsMesh, atmosphereMesh, sunMesh, sunLight, issMesh, issOrbitPath, issOrbitGeometry, starlinkGroup, jwstMesh;
        let issHistory = [];
        let followISS = false;

        window.addEventListener('load', () => {
            initScene();
            createSpace();
            createRealisticEarth();
            createSun();
            createISS();
            createStarlink();
            createJWST();
            setupEvents();
            startLoop();
        });

        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 6;
            controls.maxDistance = 50;

            scene.add(new THREE.AmbientLight(0xffffff, 0.15));
        }

        function createSpace() {
            const starsGeo = new THREE.BufferGeometry();
            const pos = new Float32Array(3500 * 3);
            for(let i=0; i<10500; i++) pos[i] = (Math.random() - 0.5) * 350;
            starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.7, color: 0xffffff, opacity: 0.9, transparent: true })));
        }

        function createRealisticEarth() {
            const textureLoader = new THREE.TextureLoader();
            
            const dayTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
            const nightTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-night-lights.jpg');
            const cloudsTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');

            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            
            const earthMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    dayTexture: { value: dayTex },
                    nightTexture: { value: nightTex },
                    sunDirection: { value: new THREE.Vector3(1, 0, 0) }
                },
                vertexShader: `
                    varying vec3 vWorldNormal;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D dayTexture;
                    uniform sampler2D nightTexture;
                    uniform vec3 sunDirection;
                    varying vec3 vWorldNormal;
                    varying vec2 vUv;

                    void main() {
                        vec3 dayColor = texture2D(dayTexture, vUv).rgb;
                        vec3 nightColor = texture2D(nightTexture, vUv).rgb * vec3(1.2, 1.1, 0.9) * 5.5; 
                        
                        float intensity = dot(vWorldNormal, normalize(sunDirection));
                        float mixFactor = smoothstep(-0.2, 0.2, intensity);
                        
                        vec3 finalColor = mix(nightColor, dayColor * max(intensity, 0.08), mixFactor);
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });

            earthMesh = new THREE.Mesh(geometry, earthMaterial);
            scene.add(earthMesh);

            const cloudsGeo = new THREE.SphereGeometry(EARTH_RADIUS + 0.06, 64, 64);
            const cloudsMat = new THREE.MeshStandardMaterial({
                map: cloudsTex,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            cloudsMesh = new THREE.Mesh(cloudsGeo, cloudsMat);
            scene.add(cloudsMesh);

            const atmosGeo = new THREE.SphereGeometry(EARTH_RADIUS + 0.25, 64, 64);
            const atmosMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 2.5);
                        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity * 1.5;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });
            atmosphereMesh = new THREE.Mesh(atmosGeo, atmosMat);
            scene.add(atmosphereMesh);
        }

        function createSun() {
            const sunGeo = new THREE.SphereGeometry(1.5, 32, 32);
            sunMesh = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ color: 0xfffbdb }));
            sunMesh.position.set(35, 0, 0);

            sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
            sunLight.position.copy(sunMesh.position);
            scene.add(sunLight);
            scene.add(sunMesh);
        }

        function createISS() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 0.2, 0.6),
                new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 })
            );
            group.add(body);

            const panels = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 0.02, 0.3),
                new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 })
            );
            group.add(panels);

            issMesh = group;
            scene.add(issMesh);

            issOrbitGeometry = new THREE.BufferGeometry();
            issOrbitPath = new THREE.Line(issOrbitGeometry, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7 }));
            scene.add(issOrbitPath);
        }

        function createStarlink() {
            starlinkGroup = new THREE.Group();
            const geo = new THREE.SphereGeometry(0.025, 6, 6);
            const mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.9 });

            for(let i=0; i<350; i++) {
                const lat = (Math.random() - 0.5) * 160;
                const lon = (Math.random() - 0.5) * 360;
                const pos = getVector(lat, lon, EARTH_RADIUS + 0.3);
                const sat = new THREE.Mesh(geo, mat);
                sat.position.copy(pos);
                starlinkGroup.add(sat);
            }
            scene.add(starlinkGroup);
        }

        // Telescopio James Webb (JWST) ubicado en el vector del punto L2
        function createJWST() {
            const jwstGroup = new THREE.Group();
            
            // Espejo dorado hexagonal estilizado
            const mirrorGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.02, 6);
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.9, roughness: 0.1 });
            const mirror = new THREE.Mesh(mirrorGeo, mirrorMat);
            mirror.rotation.x = Math.PI / 2;
            jwstGroup.add(mirror);

            // Marcador de punto violeta
            const glowGeo = new THREE.SphereGeometry(0.08, 12, 12);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xc084fc });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            jwstGroup.add(glow);

            jwstMesh = jwstGroup;
            // Ubicación lejana simulada en la órbita alta L2
            jwstMesh.position.set(-12, 3, -10);
            scene.add(jwstMesh);
        }

        function getVector(lat, lon, alt) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(alt * Math.sin(phi) * Math.cos(theta)),
                alt * Math.cos(phi),
                alt * Math.sin(phi) * Math.sin(theta)
            );
        }

        async function fetchISS() {
            try {
                const t0 = performance.now();
                const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                const data = await res.json();
                document.getElementById('api-latency').textContent = `${Math.round(performance.now() - t0)}ms`;

                document.getElementById('telemetry-lat').textContent = `${data.latitude.toFixed(4)}°`;
                document.getElementById('telemetry-lon').textContent = `${data.longitude.toFixed(4)}°`;
                document.getElementById('telemetry-alt').textContent = `${data.altitude.toFixed(1)} km`;
                document.getElementById('telemetry-spd').textContent = `${Math.round(data.velocity).toLocaleString()} km/h`;

                const pos = getVector(data.latitude, data.longitude, EARTH_RADIUS + 0.4);
                issMesh.position.copy(pos);
                issMesh.lookAt(0,0,0);

                issHistory.push(pos.clone());
                if(issHistory.length > 80) issHistory.shift();
                issOrbitGeometry.setFromPoints(issHistory);

                if(followISS) {
                    controls.target.copy(issMesh.position);
                }
            } catch(e) { console.error(e); }
        }

        // Obtener nombres y cantidad exacta de personas a bordo
        async function fetchCrew() {
            try {
                const res = await fetch('https://api.open-notify.org/astros.json');
                const data = await res.json();
                const issCrew = data.people.filter(p => p.craft === 'ISS');
                const count = issCrew.length > 0 ? issCrew.length : 7;
                
                document.getElementById('crew-count').textContent = `${count} astronautas`;
                
                if (issCrew.length > 0) {
                    document.getElementById('crew-list').innerHTML = issCrew.map(p => `
                        <div class="p-2 bg-white/5 rounded-lg border border-white/5 text-white/90 text-xs flex justify-between items-center">
                            <span>${p.name}</span>
                            <span class="text-[9px] text-emerald-400 font-mono">ISS</span>
                        </div>
                    `).join('');
                } else {
                    fallbackCrewList(count);
                }
            } catch(e) {
                fallbackCrewList(7);
            }
        }

        function fallbackCrewList(count) {
            document.getElementById('crew-count').textContent = `${count} astronautas`;
            const defaultCrew = ["Sunita Williams", "Barry Wilmore", "Nick Hague", "Aleksandr Gorbunov", "Alexey Ovchinin", "Ivan Vagner", "Donald Pettit"];
            document.getElementById('crew-list').innerHTML = defaultCrew.map(name => `
                <div class="p-2 bg-white/5 rounded-lg border border-white/5 text-white/90 text-xs flex justify-between items-center">
                    <span>${name}</span>
                    <span class="text-[9px] text-emerald-400 font-mono">A Bordo</span>
                </div>
            `).join('');
        }

        function startLoop() {
            fetchISS();
            fetchCrew();
            let count = 5;
            setInterval(() => {
                count--;
                if(count <= 0) { fetchISS(); count = 5; }
                document.getElementById('api-countdown').textContent = `${count}s`;
            }, 1000);
        }

        function setFollowState(state) {
            followISS = state;
            const btn = document.getElementById('toggle-follow-iss');
            const label = document.getElementById('follow-status-label');
            if(followISS) {
                btn.classList.add('active');
                label.textContent = "ON";
                controls.target.copy(issMesh.position);
            } else {
                btn.classList.remove('active');
                label.textContent = "OFF";
            }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('btn-recenter').addEventListener('click', () => {
                setFollowState(true);
            });

            document.getElementById('toggle-follow-iss').addEventListener('click', () => {
                setFollowState(!followISS);
            });

            // Si el usuario mueve la cámara manualmente con el ratón, se desactiva suavemente el seguimiento
            controls.addEventListener('start', () => { 
                if(followISS) setFollowState(false); 
            });
            
            document.getElementById('toggle-starlink').addEventListener('click', (e) => {
                e.currentTarget.classList.toggle('active');
                starlinkGroup.visible = e.currentTarget.classList.contains('active');
            });
            document.getElementById('toggle-jwst').addEventListener('click', (e) => {
                e.currentTarget.classList.toggle('active');
                jwstMesh.visible = e.currentTarget.classList.contains('active');
            });
            document.getElementById('toggle-clouds').addEventListener('click', (e) => {
                e.currentTarget.classList.toggle('active');
                cloudsMesh.visible = e.currentTarget.classList.contains('active');
                atmosphereMesh.visible = e.currentTarget.classList.contains('active');
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = new Date();
            document.getElementById('utc-clock').textContent = now.toUTCString().split(' ')[4] + ' UTC';
            document.getElementById('date-display').textContent = now.toUTCString().split(' ').slice(1, 4).join(' ');
            
            const seconds = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
            const angle = (seconds / 86400) * Math.PI * 2 - Math.PI;
            const sunDistance = 35;

            sunMesh.position.x = Math.cos(angle) * sunDistance;
            sunMesh.position.z = Math.sin(angle) * sunDistance;
            sunLight.position.copy(sunMesh.position);
            
            if (earthMesh && earthMesh.material.uniforms) {
                earthMesh.material.uniforms.sunDirection.value.copy(sunMesh.position).normalize();
            }

            if(cloudsMesh) cloudsMesh.rotation.y += 0.00015;
            if(starlinkGroup) starlinkGroup.rotation.y += 0.0003;
            if(jwstMesh) jwstMesh.rotation.y += 0.005;

            if(followISS && issMesh) {
                controls.target.copy(issMesh.position);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
